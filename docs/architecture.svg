<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the hft engine</title>
  <desc id="d">Market data flows through the feed handler, book, strategy, risk, OMS and gateway inside hft_live. Orders are mirrored through a pipe to a bridge process that talks to the exchange sandbox. Reports come back through a second pipe into the OMS. A supervisor wraps the processes, and the event log feeds the PnL report.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#ffffff"/>

  <!-- supervisor frame -->
  <rect x="12" y="12" width="956" height="596" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="28" y="36" font-size="14" font-weight="700" fill="#334155">scripts/supervise.py: restarts with backoff, watchdog on metrics, SIGTERM is the kill path, no restart after an integrity exit</text>

  <!-- hft_live frame -->
  <rect x="28" y="130" width="924" height="196" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="140" y="152" font-size="13" font-weight="700" fill="#1d4ed8">hft_live: one thread, run to completion, no heap, locks, exceptions, virtual calls or syscalls on this path</text>

  <!-- capture -->
  <rect x="28" y="52" width="170" height="56" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="113" y="76" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">capture_l2.py</text>
  <text x="113" y="94" font-size="11" text-anchor="middle" fill="#475569">level 2 websocket, JSON lines</text>
  <line x1="113" y1="108" x2="113" y2="172" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="121" y="128" font-size="10" fill="#475569">stdin pipe</text>

  <!-- chain -->
  <rect x="44" y="172" width="140" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="114" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">convert + feed</text>
  <text x="114" y="212" font-size="11" text-anchor="middle" fill="#475569">arbitrate, gaps,</text>
  <text x="114" y="226" font-size="11" text-anchor="middle" fill="#475569">snapshot recovery</text>

  <rect x="204" y="172" width="120" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="264" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">order book</text>
  <text x="264" y="212" font-size="11" text-anchor="middle" fill="#475569">flat levels, intrusive</text>
  <text x="264" y="226" font-size="11" text-anchor="middle" fill="#475569">order lists</text>

  <rect x="344" y="172" width="130" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="409" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">market maker</text>
  <text x="409" y="212" font-size="11" text-anchor="middle" fill="#475569">imbalance signal,</text>
  <text x="409" y="226" font-size="11" text-anchor="middle" fill="#475569">inventory skew</text>

  <rect x="494" y="172" width="130" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="559" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">pre-trade risk</text>
  <text x="559" y="212" font-size="11" text-anchor="middle" fill="#475569">limits, price band,</text>
  <text x="559" y="226" font-size="11" text-anchor="middle" fill="#475569">latched kill switch</text>

  <rect x="644" y="172" width="150" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="719" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">OMS + gateway</text>
  <text x="719" y="212" font-size="11" text-anchor="middle" fill="#475569">8-state machine,</text>
  <text x="719" y="226" font-size="11" text-anchor="middle" fill="#475569">encode, order tap</text>

  <rect x="814" y="172" width="124" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="876" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">segment logic</text>
  <text x="876" y="212" font-size="11" text-anchor="middle" fill="#475569">flatten, close,</text>
  <text x="876" y="226" font-size="11" text-anchor="middle" fill="#475569">carry position</text>

  <g stroke="#374151" stroke-width="1.6" marker-end="url(#a)">
    <line x1="184" y1="204" x2="204" y2="204"/>
    <line x1="324" y1="204" x2="344" y2="204"/>
    <line x1="474" y1="204" x2="494" y2="204"/>
    <line x1="624" y1="204" x2="644" y2="204"/>
  </g>
  <line x1="794" y1="204" x2="814" y2="204" stroke="#374151" stroke-width="1.6"/>

  <text x="44" y="262" font-size="11" fill="#475569">checks while running: book against an independent model, desync and stale-feed guards, model check at segment end</text>
  <text x="44" y="280" font-size="11" fill="#475569">events: JSON log (fills, mids, segment ends), Prometheus metrics, position file (carried across restarts)</text>
  <text x="44" y="298" font-size="11" fill="#475569">measured: about 115-130 ns p50 packet to staged order frame, hot caches (docs/RESULTS.md)</text>

  <!-- orders pipe down -->
  <line x1="690" y1="236" x2="690" y2="356" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="682" y="292" font-size="10" text-anchor="end" fill="#475569">orders pipe: new, replace,</text>
  <text x="682" y="305" font-size="10" text-anchor="end" fill="#475569">cancel, IOC close</text>

  <!-- reports pipe up (orange) -->
  <line x1="770" y1="356" x2="770" y2="236" stroke="#9a3412" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="778" y="292" font-size="10" fill="#9a3412">reports pipe: acks, fills,</text>
  <text x="778" y="305" font-size="10" fill="#9a3412">cancels, account balance</text>

  <!-- bridge -->
  <rect x="470" y="356" width="400" height="84" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="670" y="380" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">order_bridge.py</text>
  <text x="670" y="400" font-size="11" text-anchor="middle" fill="#475569">signed REST, paced under the rate limit, post-only quotes,</text>
  <text x="670" y="416" font-size="11" text-anchor="middle" fill="#475569">IOC only for closing, price and notional checks, sandbox URL only,</text>
  <text x="670" y="432" font-size="11" text-anchor="middle" fill="#475569">fills from websocket plus REST sync, cancel-all at start and exit</text>

  <line x1="670" y1="440" x2="670" y2="490" stroke="#374151" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="680" y="470" font-size="10" fill="#475569">HTTPS, websocket</text>

  <rect x="470" y="490" width="400" height="56" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="670" y="514" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Coinbase Exchange sandbox</text>
  <text x="670" y="532" font-size="11" text-anchor="middle" fill="#b91c1c">never run: no key was available (tested against a local fake)</text>

  <!-- event log + report -->
  <rect x="44" y="392" width="190" height="52" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="139" y="414" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">events.jsonl, metrics</text>
  <text x="139" y="432" font-size="11" text-anchor="middle" fill="#475569">fills, mids, segment ends</text>
  <line x1="139" y1="326" x2="139" y2="392" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="44" y="492" width="190" height="52" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="139" y="514" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">pnl_report.py</text>
  <text x="139" y="532" font-size="11" text-anchor="middle" fill="#475569">PnL, edge, markouts, inventory</text>
  <line x1="139" y1="444" x2="139" y2="492" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- offline box -->
  <rect x="270" y="392" width="170" height="152" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="355" y="414" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">offline only</text>
  <text x="355" y="436" font-size="11" text-anchor="middle" fill="#475569">matching engine,</text>
  <text x="355" y="452" font-size="11" text-anchor="middle" fill="#475569">exchange simulator,</text>
  <text x="355" y="468" font-size="11" text-anchor="middle" fill="#475569">queue-aware backtester,</text>
  <text x="355" y="484" font-size="11" text-anchor="middle" fill="#475569">byte-exact replay oracle,</text>
  <text x="355" y="500" font-size="11" text-anchor="middle" fill="#475569">9 fuzz targets, mutation</text>
  <text x="355" y="516" font-size="11" text-anchor="middle" fill="#475569">checks, fault drills</text>

  <text x="470" y="582" font-size="11" fill="#475569">Blue: the C++ process. Orange: the Python bridge. Dashed: tooling that never touches an exchange.</text>
</svg>
