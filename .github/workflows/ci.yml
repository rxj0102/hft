name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Warnings are errors everywhere. The long "gate" tests (millions of events)
  # run only on the optimised build; the sanitizer builds run the default sizes.
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [release, asan, ubsan]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 g++-13
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j2
      # The Python tests start processes, pipes and sockets and depend on real time, so they run once, on the
      # gcc release build, with the interpreter and library version they were developed with. scripts/ci_local.sh
      # runs the same steps on a developer machine. A pass on the second try is reported as a warning.
      - uses: actions/setup-python@v5
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Python environment
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: python3 -m pip install -r scripts/requirements.txt && python3 -m py_compile scripts/*.py
      - name: Capture script tests
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: scripts/ci_retry.sh test_capture python3 scripts/test_capture.py
      - name: Live tool tests (process, pipe, signals, real-time silence)
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: scripts/ci_retry.sh test_live_tool python3 scripts/test_live_tool.py build/release/hft_live
      - name: Order bridge tests (local fake exchange)
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: scripts/ci_retry.sh test_bridge python3 scripts/test_bridge.py build/release/hft_live
      - name: Sandbox smoke test (against the local fake exchange only)
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: scripts/ci_retry.sh test_smoke python3 scripts/test_smoke.py
      - name: Fault drills (supervisor, local fake feed)
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: scripts/ci_retry.sh drill python3 scripts/drill.py --live build/release/hft_live

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset tsan && cmake --build --preset tsan
      - run: ctest --test-dir build/tsan --output-on-failure

  # Short fuzz run of every target, enough to catch a regression in the parsers,
  # the order entry codec, the OMS and the whole pipeline. Longer runs are done offline.
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Run each target for 45 seconds
        run: |
          for t in fuzz_md fuzz_match fuzz_oms fuzz_codec fuzz_venue fuzz_pipeline; do
            mkdir -p corpus/$t
            seeds=""; [ -d fuzz/seeds/${t#fuzz_} ] && seeds="fuzz/seeds/${t#fuzz_}"
            build/fuzz/fuzz/$t -max_total_time=45 -timeout=10 corpus/$t $seeds
          done
          mkdir -p corpus/fuzz_l2
          build/fuzz/fuzz/fuzz_l2 -max_total_time=45 -timeout=10 corpus/fuzz_l2 fuzz/seeds/l2
          mkdir -p corpus/fuzz_live
          build/fuzz/fuzz/fuzz_live -max_total_time=45 -timeout=10 corpus/fuzz_live fuzz/seeds/live
          mkdir -p corpus/fuzz_external
          build/fuzz/fuzz/fuzz_external -max_total_time=45 -timeout=10 corpus/fuzz_external fuzz/seeds/external
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: crash-*
          if-no-files-found: ignore

  # The performance gate. Wall-clock time on a shared runner is noise, so the
  # gate counts instructions under valgrind (deterministic) against the checked
  # in baseline. The latency run, the flame graph and the cache report are
  # uploaded as artifacts for a human to read; they never fail the build.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind binutils g++-13
      - name: Build (fixed ISA, frame pointers, debug info)
        run: cmake --preset perf && cmake --build build/perf --target bench_t2t
        env:
          CC: gcc-13
          CXX: g++-13
      - name: Instruction-count gate
        run: python3 scripts/perf_gate.py --bench build/perf/bench/bench_t2t --strict
      - name: Latency report (informational)
        run: |
          cmake --preset release && cmake --build build/release --target bench_t2t
          mkdir -p perf-out
          build/release/bench/bench_t2t --json perf-out/latency.json | tee perf-out/latency.txt
        env:
          CC: gcc-13
          CXX: g++-13
      - name: Flame graph (informational)
        run: |
          build/perf/bench/bench_t2t --profile perf-out/samples.txt --seconds 20
          python3 scripts/flamegraph.py perf-out/samples.txt perf-out/flame.svg --folded perf-out/flame.folded | tee perf-out/self-time.txt
      - uses: actions/upload-artifact@v4
        with:
          name: perf
          path: perf-out
